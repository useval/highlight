name: Feature request
description: A new language, a theme, a new option, or a change in behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Many customisations need no change to the package. Before opening,
        check whether you can do it from your app: see
        [Changing a built-in language](https://github.com/useval/highlight/blob/main/val_highlight/README.md#-changing-a-built-in-language)
        and [Themes](https://github.com/useval/highlight/blob/main/val_highlight/README.md#-themes).

  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is it?
      options:
        - A new language
        - Better highlighting for an existing language
        - A theme
        - A widget option or behaviour
        - An engine or API change
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who runs into it, and when. A real example helps most.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Example code
      description: >-
        For a language request, a realistic sample of the code you want
        highlighted, and the file extensions it uses.
      render: text

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The behaviour, and if you have one in mind, the API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: >-
        Workarounds or existing options you considered — `Grammar.extend`,
        `withKeywords`, `ValTheme.extend`, `spanBuilder` — and why they fall
        short.

  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I searched open issues and pull requests for a duplicate.
          required: true
