name: Publish

# Tag-triggered, so a published version is always one that passed the gate.
# Each package has its own tag prefix:
#
#   val_highlight-v0.1.1          publishes val_highlight
#   val_highlight_flutter-v0.1.1  publishes val_highlight_flutter
#
# Uses pub.dev automated publishing: the token is minted from GitHub's OIDC
# identity, so there is no long-lived credential in repository secrets.
# Set up once per package, after its first version is on pub.dev:
#   pub.dev → <package> → Admin → Automated publishing
#   → GitHub repository: useval/highlight, tag pattern: <package>-v{{version}}
on:
  push:
    tags:
      - 'val_highlight-v[0-9]+.[0-9]+.[0-9]+*'
      - 'val_highlight_flutter-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  gate:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      published: ${{ steps.pubdev.outputs.published }}

    steps:
      - uses: actions/checkout@v7

      - name: Read package and version from the tag
        id: tag
        run: |
          package="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$package $version"

      - name: Tag matches pubspec version
        run: |
          package="${{ steps.tag.outputs.package }}"
          version="$(sed -n 's/^version: *//p' "$package/pubspec.yaml")"
          if [ "$version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "tag says ${{ steps.tag.outputs.version }}, $package/pubspec.yaml says $version"
            exit 1
          fi

      - name: Changelog has an entry for this version
        run: |
          package="${{ steps.tag.outputs.package }}"
          version="${{ steps.tag.outputs.version }}"
          grep -qE "^## +\[?${version//./\\.}\]?" "$package/CHANGELOG.md" || {
            echo "$package/CHANGELOG.md has no '## $version' heading"
            exit 1
          }

      # A version published by hand (the first release of each package) is
      # tagged afterwards; there is nothing left to publish.
      - name: Already on pub.dev?
        id: pubdev
        run: |
          package="${{ steps.tag.outputs.package }}"
          version="${{ steps.tag.outputs.version }}"
          if curl -sf "https://pub.dev/api/packages/$package" |
            grep -q "\"version\":\"$version\""; then
            echo "::notice::$package $version is already on pub.dev; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read pinned Flutter version
        if: steps.pubdev.outputs.published == 'false'
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: steps.pubdev.outputs.published == 'false'
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: pub.dev score
        if: steps.pubdev.outputs.published == 'false'
        run: ./scripts/score.sh "${{ steps.tag.outputs.package }}" 160

  publish:
    needs: gate
    if: needs.gate.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to mint the pub.dev credential

    steps:
      - uses: actions/checkout@v7

      # Configures the pub.dev credential from GitHub's OIDC token.
      - uses: dart-lang/setup-dart@v1

      - name: Read pinned Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      # Flutter, not only Dart: val_highlight_flutter depends on the Flutter
      # SDK, and the workspace resolves both packages together.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Publish
        working-directory: ${{ needs.gate.outputs.package }}
        run: flutter pub publish --force
