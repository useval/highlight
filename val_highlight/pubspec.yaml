name: val_highlight
description: "Syntax highlighting for 55 languages in pure Dart. Incremental updates, themes, VS Code theme import, and HTML output. Runs on every platform."
version: 0.1.0
homepage: https://github.com/useval/highlight
repository: https://github.com/useval/highlight/tree/main/val_highlight
issue_tracker: https://github.com/useval/highlight/issues

environment:
  sdk: ^3.9.0

resolution: workspace

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

topics:
  - syntax-highlighting
  - highlighter
  - code
  - tokenizer
  - html
