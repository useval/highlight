name: val_highlight_flutter
description: "Flutter widgets for syntax-highlighted code: CodeView for display and CodeField for editing, with 55 languages, themes and smooth large files."
version: 0.1.2
homepage: https://github.com/useval/highlight
repository: https://github.com/useval/highlight/tree/main/val_highlight_flutter
issue_tracker: https://github.com/useval/highlight/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.1
  val_highlight: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - syntax-highlighting
  - code-editor
  - code
  - highlight
  - highlighter
